#docker compose file (local development)

services:
  web:
    build: .
    container_name: dentaltech-local-web
    command: ./wait-for-it.sh postgres:5432 -- ./docker-entrypoint.local.sh
    restart: always
    env_file:
      - .env
    environment:
      SERVICE: web
      ENVIRONMENT: local  #used only in settings/**.py to decide protocol & domain
      IS_DOCKERIZED: True
      DJANGO_SETTINGS_MODULE: DentalTech.settings.dev
    ports:
      - "8000:8000"  #direct port exposure, no nginx needed
    volumes:
      - .:/app
      - ./logs:/app/logs
      - static-data:/app/static
      - media-data:/app/media
    networks:
      - dentaltech-local-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      retries: 5
      timeout: 10s
      interval: 20s
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPU_LIMIT:-0.75}'
          memory: '${WEB_RAM_LIMIT:-400M}'
        reservations:
          cpus: '${WEB_CPU_RESERVE:-0.25}'
          memory: '${WEB_RAM_RESERVE:-200M}'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"

  qcluster:
    build: .
    container_name: dentaltech-local-qcluster
    command: ./wait-for-it.sh postgres:5432 -- ./docker-entrypoint.local.sh
    profiles: ["local"]
    restart: always
    env_file:
      - .env
    environment:
      SERVICE: qcluster
      ENVIRONMENT: local
      IS_DOCKERIZED: True
      DJANGO_SETTINGS_MODULE: DentalTech.settings.dev
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${DB_PORT}
    depends_on:
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./logs:/app/logs
    networks:
      - dentaltech-local-network
    healthcheck:
      test: ["CMD-SHELL", "python manage.py shell -c \"from django_q.models import Task; print('OK')\" || exit 1"]
      retries: 3
      timeout: 10s
      interval: 30s
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '${QCLUSTER_CPU_LIMIT:-0.5}'
          memory: '${QCLUSTER_RAM_LIMIT:-200M}'
        reservations:
          cpus: '${QCLUSTER_CPU_RESERVE:-0.1}'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  postgres:
    image: postgres:17-alpine
    container_name: dentaltech-local-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - dentaltech-local-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      retries: 5
      timeout: 10s
      interval: 5s
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-0.75}'
          memory: '${POSTGRES_RAM_LIMIT:-400M}'
        reservations:
          cpus: '${POSTGRES_CPU_RESERVE:-0.25}'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: dentaltech-local-smtp4dev
    ports:
      - "5025:80"
    restart: always
    profiles: ["local"]
    networks:
      - dentaltech-local-network
    deploy:
      resources:
        limits:
          cpus: '${SMTP_CPU_LIMIT:-0.1}'
          memory: '${SMTP_RAM_LIMIT:-100M}'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  tests:
    build: .
    container_name: dentaltech-local-tests
    command: ./wait-for-it.sh postgres:5432 -- ptw --poll --runner "pytest --testmon -v -x"
    tty: true
    profiles: ["local"]
    env_file:
      - .env
    environment:
      - ENVIRONMENT=local
      - IS_DOCKERIZED=True
      - TESTMON_DATAFILE=/app/.cache/.testmondata
      - DJANGO_SETTINGS_MODULE=DentalTech.settings.dev 
      - PYTHONWARNINGS=ignore::SyntaxWarning
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - dentaltech-local-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1000M'
        # reservations:
          # cpus: '0.25'
          # memory: '500M'

  profiler:
    build: .
    container_name: dentaltech-local-profiler
    command: ./wait-for-it.sh postgres:5432 -- locust -f profiler.py --host=http://web:8000 --web-host=0.0.0.0
    tty: true
    profiles: ["local"]
    env_file:
      - .env
    environment:
      - ENVIRONMENT=local
      - IS_DOCKERIZED=True
      - DJANGO_SETTINGS_MODULE=DentalTech.settings.dev 
      - PYTHONWARNINGS=ignore::SyntaxWarning
    ports:
      - "8089:8089"   #locust's port for performance testing
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - dentaltech-local-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1000M'
        # reservations:
          # cpus: '0.25'
          # memory: '500M'


networks:
  dentaltech-local-network:
    driver: bridge

volumes:
  pg-data:
  static-data:
  media-data: