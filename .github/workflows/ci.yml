name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --system --deploy --dev
      - name: Create required directories
        run: mkdir -p logs media static
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: DentalTech.settings.dev
          ENVIRONMENT: local
          DEV_SECRET_KEY: "ci-fake-secret-key"
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_PORT: "5432"
          EMAIL_PORT: "25"
        run: pytest --maxfail=3 --tb=short