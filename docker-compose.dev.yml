#docker compose file (for development)

services:
  web:
    build: .
    container_name: dentaltech-dev-web
    command: ./wait-for-it.sh postgres:5432 -- ./docker-entrypoint.dev.sh
    restart: always
    env_file:
      - .env
    environment:
      SERVICE: web
      ENVIRONMENT: development
      IS_DOCKERIZED: True
      # ENABLE_SWAGGER: True
      DJANGO_SETTINGS_MODULE: DentalTech.settings.dev
    ports: []  #nginx handles traffic, no direct port exposure
    volumes:
      - .:/app
      - ./logs:/app/logs
      - static-data:/app/static
      - media-data:/app/media
      - gunicorn-socket:/run/gunicorn
    networks:
      - dentaltech-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--unix-socket", "/run/gunicorn/gunicorn.sock", "http://localhost/health/"]
      retries: 10
      timeout: 10s
      interval: 30s
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPU_LIMIT:-0.75}'
          memory: '${WEB_RAM_LIMIT:-400M}'
        reservations:
          cpus: '${WEB_CPU_RESERVE:-0.25}'
          memory: '${WEB_RAM_RESERVE:-200M}'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 127.0.0.11

  qcluster:
    build: .
    container_name: dentaltech-dev-qcluster
    command: ./wait-for-it.sh postgres:5432 -- ./docker-entrypoint.dev.sh
    profiles: ["dev"]
    restart: always
    env_file:
      - .env
    environment:
      SERVICE: qcluster
      ENVIRONMENT: development
      IS_DOCKERIZED: True
      DJANGO_SETTINGS_MODULE: DentalTech.settings.dev
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${DB_PORT}
    depends_on:
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./logs:/app/logs
    networks:
      - dentaltech-dev-network
    healthcheck:
      test: ["CMD-SHELL", "python manage.py shell -c \"from django_q.models import Task; print('OK')\" || exit 1"]
      retries: 3
      timeout: 10s
      interval: 30s
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '${QCLUSTER_CPU_LIMIT:-0.5}'
          memory: '${QCLUSTER_RAM_LIMIT:-200M}'
        reservations:
          cpus: '${QCLUSTER_CPU_RESERVE:-0.1}'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 127.0.0.11

  postgres:
    image: postgres:17-alpine
    container_name: dentaltech-dev-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - dentaltech-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      retries: 5
      timeout: 10s
      interval: 5s
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-0.75}'
          memory: '${POSTGRES_RAM_LIMIT:-400M}'
        reservations:
          cpus: '${POSTGRES_CPU_RESERVE:-0.3}'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 127.0.0.11

  postgres-backup:
    build:
      context: .
      dockerfile: backup.Dockerfile
    container_name: dentaltech-dev-postgres-backup
    restart: always
    command: ./database-backup-cron.sh
    env_file:
      - .env
    environment:
      - SERVICE=postgres-backup
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      #S3 Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - S3_BUCKET=${S3_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${PGBACKUP_CPU_LIMIT:-0.3}'
          memory: '${PGBACKUP_RAM_LIMIT:-100M}'
    volumes:
      - ./backups:/backups
      - ./logs:/app/logs
    networks:
      - dentaltech-dev-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 127.0.0.11

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: dentaltech-dev-smtp4dev
    ports:
      - "5025:80"
    restart: always
    profiles: ["dev"]
    networks:
      - dentaltech-dev-network
    deploy:
      resources:
        limits:
          cpus: '${SMTP_CPU_LIMIT:-0.1}'
          memory: '${SMTP_RAM_LIMIT:-100M}'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
        
  nginx:
    build:
      context: ./nginx
    container_name: dentaltech-dev-nginx
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/"]
      retries: 5
      timeout: 10s
      interval: 30s
      start_period: 60s
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - static-data:/app/static
      - media-data:/app/media
      - gunicorn-socket:/run/gunicorn
      - ./nginx/ssl:/var/www/certbot
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    networks:
      - dentaltech-dev-network
    deploy:
      resources:
        limits:
          cpus: '${NGINX_CPU_LIMIT:-0.1}'
          memory: '${NGINX_RAM_LIMIT:-64M}'
        reservations:
          cpus: '${NGINX_CPU_RESERVE:-0.05}'
          memory: '${NGINX_RAM_RESERVE:-16M}'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 127.0.0.11

  certbot:
    image: certbot/certbot
    container_name: dentaltech-dev-certbot
    restart: always
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./nginx/ssl:/var/www/certbot
      - ./renew-certs.sh:/renew-certs.sh
    networks:
      - dentaltech-dev-network
    entrypoint: /bin/sh -c
    command: >
      "chmod +x /renew-certs.sh;
      trap exit TERM;
      while :; do
        /renew-certs.sh;
        sleep 12h & wait $${!};
      done"
    depends_on:
      nginx:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CERTBOT_CPU_LIMIT:-0.1}'
          memory: '${CERTBOT_RAM_LIMIT:-64M}'
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 127.0.0.11

networks:
  dentaltech-dev-network:
    driver: bridge

volumes:
  pg-data:
  gunicorn-socket:
  static-data:
  media-data:
  certbot-etc:
  certbot-var: